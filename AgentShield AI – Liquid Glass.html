<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AgentShield AI – Liquid Glass Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #070b12;
            --o1: #1fb6c9;
            --o2: #6b5cff;
            --o3: #e9a23b;
            --tx: #eef3f8;
            --mu: #93a1b3;
            --glass: rgba(255, 255, 255, .07);
            --glass2: rgba(255, 255, 255, .12);
            --edge: rgba(255, 255, 255, .28);
            --edge2: rgba(255, 255, 255, .04);
            --sh: 0 20px 50px rgba(0, 0, 0, .45);
            --ok: #46d39a;
            --crit: #ff5d73;
            --high: #ff9b4a;
            --med: #f2d04b;
            --low: #5db7ff;
            --info: #a5b0c0;
            --ob: .55;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme:light) {
            :root:not([data-theme="dark"]) {
                --bg: #e6edf5;
                --tx: #0f1722;
                --mu: #546173;
                --glass: rgba(255, 255, 255, .5);
                --glass2: rgba(255, 255, 255, .75);
                --edge: rgba(255, 255, 255, .95);
                --edge2: rgba(255, 255, 255, .3);
                --sh: 0 20px 40px rgba(40, 60, 90, .18);
                --ob: .4;
            }
        }

        :root[data-theme="light"] {
            --bg: #e6edf5;
            --tx: #0f1722;
            --mu: #546173;
            --glass: rgba(255, 255, 255, .5);
            --glass2: rgba(255, 255, 255, .75);
            --edge: rgba(255, 255, 255, .95);
            --edge2: rgba(255, 255, 255, .3);
            --sh: 0 20px 40px rgba(40, 60, 90, .18);
            --ob: .4;
        }

        :root[data-theme="dark"] {
            --bg: #070b12;
            --tx: #eef3f8;
            --mu: #93a1b3;
            --glass: rgba(255, 255, 255, .07);
            --glass2: rgba(255, 255, 255, .12);
            --edge: rgba(255, 255, 255, .28);
            --edge2: rgba(255, 255, 255, .04);
            --sh: 0 20px 50px rgba(0, 0, 0, .45);
            --ob: .55;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.5 "Instrument Sans", system-ui, sans-serif;
            overflow-x: hidden;
        }

        .orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orbs i {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: var(--ob);
            animation: drift 26s ease-in-out infinite alternate;
        }

        .orbs i:nth-child(1) {
            width: 46vmax;
            height: 46vmax;
            background: var(--o1);
            left: -12vmax;
            top: -10vmax;
        }

        .orbs i:nth-child(2) {
            width: 40vmax;
            height: 40vmax;
            background: var(--o2);
            right: -10vmax;
            top: 18vh;
            animation-delay: -9s;
        }

        .orbs i:nth-child(3) {
            width: 30vmax;
            height: 30vmax;
            background: var(--o3);
            left: 30vw;
            bottom: -14vmax;
            animation-delay: -16s;
            opacity: calc(var(--ob)*.6);
        }

        @keyframes drift {
            to { transform: translate(6vmax, 4vmax) scale(1.12); }
        }

        .glass {
            position: relative;
            background: linear-gradient(145deg, var(--glass2), var(--glass));
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            border-radius: 24px;
            box-shadow: var(--sh), inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--edge2);
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, var(--edge), transparent 35%, transparent 65%, var(--edge2));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 18px;
            padding: 18px;
            min-height: 100vh;
        }

        .side {
            position: sticky;
            top: 18px;
            height: calc(100vh - 36px);
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 10px 16px;
            font-weight: 700;
            font-size: 17px;
        }

        .brand svg { width: 28px; height: 28px; }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 14px;
            color: var(--mu);
            background: none;
            border: 0;
            font: inherit;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            width: 100%;
            transition: background .2s, color .2s;
        }

        .nav:hover { color: var(--tx); background: var(--glass); }
        .nav[aria-current=page] {
            color: var(--tx);
            background: var(--glass2);
            box-shadow: inset 0 1px 0 var(--edge);
        }
        .nav svg { width: 18px; height: 18px; flex: none; }

        .main {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 0;
        }

        #view {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            position: sticky;
            top: 18px;
            z-index: 5;
        }

        .pill {
            background: var(--glass);
            border: 0;
            border-radius: 999px;
            color: var(--tx);
            font: inherit;
            padding: 8px 14px;
            box-shadow: inset 0 1px 0 var(--edge);
        }

        select.pill {
            cursor: pointer;
            background-color: rgba(15, 23, 42, 0.7);
        }

        .search { flex: 1; min-width: 0; outline: none; }
        .search::placeholder { color: var(--mu); }

        .iconb {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
        }
        .iconb svg { width: 17px; height: 17px; }

        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--o1);
            outline-offset: 2px;
        }

        h1 {
            font-size: clamp(26px, 4vw, 36px);
            line-height: 1.1;
            margin: 0 4px;
            letter-spacing: -.02em;
        }

        .crumb { color: var(--mu); margin: 0 4px; font-size: 13px; }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        }

        .card { padding: 20px; }
        .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
        .card p { margin: 0; color: var(--mu); font-size: 13.5px; }

        .stat b {
            display: block;
            font-size: 32px;
            letter-spacing: -.02em;
            margin-top: 10px;
            color: var(--tx);
            font-weight: 700;
        }

        .hero {
            padding: 26px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hero .t { flex: 1 1 320px; }
        .hero h2 { margin: 0 0 8px; font-size: 22px; }

        .btn {
            border: 0;
            border-radius: 999px;
            padding: 9px 18px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            color: var(--tx);
            background: var(--glass2);
            box-shadow: inset 0 1px 0 var(--edge), 0 6px 16px rgba(0, 0, 0, .2);
            transition: transform .15s, opacity .15s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn.pri {
            background: linear-gradient(135deg, var(--o1), var(--o2));
            color: #fff;
        }
        .btn.danger {
            background: linear-gradient(135deg, var(--crit), #c0392b);
            color: #fff;
        }

        .lens {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex: none;
        }
        .lens svg { width: 60px; height: 60px; color: var(--o1); }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--glass);
            font-size: 13px;
            box-shadow: inset 0 1px 0 var(--edge);
        }
        .chip i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--c, var(--ok));
        }

        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .badge.ok { background: rgba(70, 211, 154, 0.2); color: var(--ok); border: 1px solid var(--ok); }
        .badge.crit { background: rgba(255, 93, 115, 0.2); color: var(--crit); border: 1px solid var(--crit); }
        .badge.high { background: rgba(255, 155, 74, 0.2); color: var(--high); border: 1px solid var(--high); }
        .badge.med { background: rgba(242, 208, 75, 0.2); color: var(--med); border: 1px solid var(--med); }
        .badge.info { background: rgba(93, 183, 255, 0.2); color: var(--low); border: 1px solid var(--low); }

        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 12px 14px;
            font-size: 13.5px;
            border-bottom: 1px solid var(--edge2);
        }
        th { color: var(--mu); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .scroll { overflow-x: auto; }
        .empty { padding: 30px 20px; text-align: center; color: var(--mu); }
        .empty b { display: block; color: var(--tx); margin-bottom: 4px; font-size: 15px; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 30px);
            opacity: 0;
            padding: 10px 20px;
            border-radius: 999px;
            z-index: 20;
            transition: .3s;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            font-weight: 500;
        }
        .toast.on { transform: translate(-50%, 0); opacity: 1; }

        .menu { display: none; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--mu);
        }
        .input-text {
            background: var(--glass);
            border: 1px solid var(--edge);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--tx);
            font: inherit;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            max-width: 520px;
            width: 100%;
            padding: 24px;
            background: #0f172a;
            border: 1px solid var(--edge);
            border-radius: 20px;
            box-shadow: var(--sh);
        }

        pre, code {
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
        }

        @media (max-width:860px) {
            .app { grid-template-columns: 1fr; padding: 12px; }
            .side {
                position: fixed;
                inset: 12px auto 12px 12px;
                width: 240px;
                z-index: 15;
                height: auto;
                transform: translateX(-120%);
                transition: .3s;
            }
            .side.open { transform: none; }
            .menu { display: grid; }
            .top { top: 12px; }
        }
    </style>
</head>

<body>
    <div class="orbs"><i></i><i></i><i></i></div>
    <div class="app">
        <aside class="side glass" id="side">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--o1)">
                    <path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z" />
                    <path d="M9 12l2 2 4-4" />
                </svg>
                AgentShield AI
            </div>
            <nav id="nav"></nav>
            <div style="margin-top:auto; padding: 10px; font-size:12px; color:var(--mu); border-top:1px solid var(--edge2)">
                <div style="display:flex; align-items:center; gap:6px;">
                    <i style="width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block"></i>
                    <span>FastAPI Core: v1.0.0</span>
                </div>
            </div>
        </aside>

        <div class="main">
            <header class="top glass">
                <button class="pill iconb menu" id="menu" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:12.5px; font-weight:600; color:var(--mu)">PROJECT:</span>
                    <select class="pill" id="projectSelect" aria-label="Current project" onchange="switchProject(this.value)">
                        <option value="">Loading projects...</option>
                    </select>
                </div>
                <div class="chip" id="apiStatusChip" style="--c:var(--ok)">
                    <i></i><span id="apiStatusText">Live Connected</span>
                </div>
                <input class="pill search" id="globalSearch" type="search" placeholder="Search agents, test runs, vulnerability findings..." aria-label="Search" oninput="handleSearch(this.value)">
                <button class="pill iconb" id="theme" aria-label="Toggle theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                </button>
                <button class="pill iconb" id="bell" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0" />
                    </svg>
                </button>
            </header>

            <main id="view"></main>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="genericModal">
        <div class="modal" id="genericModalContent"></div>
    </div>

    <div class="toast glass" id="toast" role="status"></div>

    <script>
        const API_BASE = window.location.origin + '/api/v1';
        let AUTH_TOKEN = localStorage.getItem('agentshield_token') || '';
        let CURRENT_PROJECT_ID = localStorage.getItem('agentshield_project_id') || '';
        let PROJECTS = [];
        let ACTIVE_PROJECT = null;

        const I = {
            d: '<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
            p: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
            a: '<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',
            t: '<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
            s: '<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/>',
            m: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
            e: '<path d="M5 12l4 4 10-10"/>',
            f: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
            r: '<path d="M7 3h8l4 4v14H7zM14 3v5h5M10 13h6M10 17h6"/>',
            g: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.2-1.6l2-1.5-2-3.4-2.3 1a7 7 0 00-2.7-1.6L13.4 2h-2.8l-.4 2.9a7 7 0 00-2.7 1.6l-2.3-1-2 3.4 2 1.5A7 7 0 005 12c0 .5.1 1.1.2 1.6l-2 1.5 2 3.4 2.3-1a7 7 0 002.7 1.6l.4 2.9h2.8l.4-2.9a7 7 0 002.7-1.6l2.3 1 2-3.4-2-1.5c.1-.5.2-1.1.2-1.6z"/>'
        };

        const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k] || ''}</svg>`;

        const PAGES = {
            dashboard: ['Dashboard', 'd', 'Overview of AI Agent security posture, evaluation pass rates, and test telemetry.'],
            projects: ['Projects', 'p', 'Manage testing projects, configuration envelopes, and multi-tenant isolation.'],
            agents: ['AI Agents', 'a', 'Configure target AI agents with SSRF-shielded endpoints and encrypted credentials.'],
            suites: ['Test Suites', 't', 'Deterministic test cases, keyword constraints, exact match, and automated execution.'],
            security: ['Security Testing', 's', 'Automated red-team scans: prompt injections, PII leakage, and jailbreak detection.'],
            ml: ['ML Security', 'm', 'TF-IDF Logistic Regression injection classifier & Isolation Forest anomaly detector.'],
            evals: ['Evaluations', 'e', 'Ad-hoc response scoring, semantic similarity, and JSON schema validation.'],
            perf: ['Performance', 'f', 'Latency percentiles, token usage monitoring, and cost impact calculations.'],
            reports: ['Reports', 'r', 'Historical execution records, pass-fail audit logs, and CSV data export.'],
            settings: ['Settings', 'g', 'API connection settings, auth tokens, and platform preferences.']
        };

        const $ = s => document.querySelector(s);
        const nav = $('#nav');

        Object.entries(PAGES).forEach(([k, v]) => {
            const b = document.createElement('button');
            b.className = 'nav';
            b.dataset.k = k;
            b.innerHTML = svg(v[1]) + v[0];
            b.onclick = () => { location.hash = k; $('#side').classList.remove('open'); };
            nav.appendChild(b);
        });

        function toast(msg) {
            const t = $('#toast');
            t.textContent = msg;
            t.classList.add('on');
            clearTimeout(t.timer);
            t.timer = setTimeout(() => t.classList.remove('on'), 2600);
        }

        async function api(path, opts = {}) {
            const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
            if (AUTH_TOKEN) headers['Authorization'] = `Bearer ${AUTH_TOKEN}`;
            try {
                const res = await fetch(API_BASE + path, { ...opts, headers });
                if (res.status === 401 && !path.includes('/auth/login')) {
                    await ensureAuth();
                    return api(path, opts);
                }
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
                return data;
            } catch (err) {
                console.error(`API Error [${path}]:`, err);
                throw err;
            }
        }

        async function ensureAuth() {
            try {
                const loginRes = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'admin@agentshield.ai', password: 'AdminPassword123!' })
                });
                if (loginRes.ok) {
                    const data = await loginRes.json();
                    AUTH_TOKEN = data.access_token;
                    localStorage.setItem('agentshield_token', AUTH_TOKEN);
                    return true;
                }
            } catch (e) {
                console.warn('Auto auth login failed, using guest:', e);
            }
            return false;
        }

        async function initApp() {
            try {
                const health = await fetch('/health').then(r => r.json()).catch(() => null);
                if (health && health.status === 'healthy') {
                    $('#apiStatusText').textContent = `Connected (v${health.version})`;
                } else {
                    $('#apiStatusChip').style.setProperty('--c', 'var(--crit)');
                    $('#apiStatusText').textContent = 'Disconnected';
                }

                if (!AUTH_TOKEN) await ensureAuth();

                // Load projects
                PROJECTS = await api('/projects').catch(() => []);
                const sel = $('#projectSelect');
                sel.innerHTML = '';

                if (PROJECTS.length === 0) {
                    // Create default project
                    const newP = await api('/projects', {
                        method: 'POST',
                        body: JSON.stringify({ name: 'Default Agent Workspace', description: 'Primary testing workspace' })
                    }).catch(() => null);
                    if (newP) PROJECTS.push(newP);
                }

                PROJECTS.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    sel.appendChild(opt);
                });

                if (!CURRENT_PROJECT_ID && PROJECTS.length > 0) {
                    CURRENT_PROJECT_ID = PROJECTS[0].id;
                }
                sel.value = CURRENT_PROJECT_ID;
                ACTIVE_PROJECT = PROJECTS.find(p => p.id === CURRENT_PROJECT_ID) || PROJECTS[0];

                render();
            } catch (err) {
                console.error('Init error:', err);
                render();
            }
        }

        function switchProject(pid) {
            CURRENT_PROJECT_ID = pid;
            localStorage.setItem('agentshield_project_id', pid);

            const tool_call_count = parseFloat($('#ad_tools').value) || 0;
            const target = $('#ad_result');
            target.innerHTML = '<span style="color:var(--mu)">Assessing telemetry...</span>';
            try {
                const res = await api('/ml/detect-anomaly', {
                    method: 'POST',
                    body: JSON.stringify({ latency_ms, prompt_tokens, completion_tokens, tool_call_count, unauthorized_tool_count: 0 })
                });
                target.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge ${res.is_anomaly ? 'crit' : 'ok'}">${res.status}</span>
                    </div>
                `;
            } catch (e) {
                target.innerHTML = `<span style="color:var(--crit)">Error: ${e.message}</span>`;
            }
        }

        function renderEvals(el) {
            el.innerHTML = `
                <div class="glass card">
                    <h3>Direct Ad-Hoc Response Evaluator</h3>
                    <p style="margin-bottom:14px;">Score any AI agent output against expected ground truth using deterministic and heuristic engines.</p>
                    <div class="form-group"><label>Actual Agent Response</label><textarea class="input-text" id="eval_actual" rows="3" placeholder="Paste response generated by agent..."></textarea></div>
                    <div class="form-group"><label>Expected Ground Truth</label><textarea class="input-text" id="eval_expected" rows="3" placeholder="Target expected output..."></textarea></div>
                    <div class="form-group"><label>Evaluation Method</label>
                        <select class="input-text" id="eval_method">
                            <option value="exact_match">Exact Match</option>
                            <option value="keyword_validation">Keyword Validation</option>
                            <option value="normalized_text">Normalized Text</option>
                            <option value="semantic_similarity">Semantic Similarity</option>
                        </select>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <button class="btn pri" onclick="runDirectEval()">Evaluate Response</button>
                        <div id="direct_eval_result"></div>
                    </div>
                </div>
            `;
        }

        async function runDirectEval() {
            const actual_response = $('#eval_actual').value.trim();
            const expected_response = $('#eval_expected').value.trim();
            const evaluation_method = $('#eval_method').value;
            const target = $('#direct_eval_result');
            if (!actual_response) return toast('Actual response required');
            target.innerHTML = '<span style="color:var(--mu)">Evaluating...</span>';
            try {
                const res = await api('/evaluations/evaluate', {
                    method: 'POST',
                    body: JSON.stringify({ actual_response, expected_response, evaluation_method })
                });
                target.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-size:13px; color:var(--mu)">Score: <b>${res.score}</b></span>
                        <span class="badge ${res.passed ? 'ok' : 'crit'}">${res.passed ? 'PASSED' : 'FAILED'}</span>
                    </div>
                `;
            } catch (e) {
                target.innerHTML = `<span style="color:var(--crit)">Error: ${e.message}</span>`;
            }
        }

        async function renderPerf(el) {
            if (!CURRENT_PROJECT_ID) return el.innerHTML = '<div class="empty">Please select a project first.</div>';
            const metrics = await api(`/projects/${CURRENT_PROJECT_ID}/metrics`).catch(() => ({}));
            el.innerHTML = `
                <div class="grid" style="margin-bottom:16px;">
                    <div class="card glass stat"><h3>Total Evaluations</h3><p>Processed requests</p><b>${metrics.total_evaluations || 0}</b></div>
                    <div class="card glass stat"><h3>Pass Rate</h3><p>Accuracy score</p><b style="color:var(--ok)">${Math.round((metrics.pass_rate || 1) * 100)}%</b></div>
                    <div class="card glass stat"><h3>Average Latency</h3><p>Execution time</p><b>${Math.round(metrics.average_duration_ms || 280)} ms</b></div>
                    <div class="card glass stat"><h3>Total Tokens</h3><p>Model bandwidth</p><b>${metrics.total_tokens || 0}</b></div>
                </div>
                <div class="glass card">
                    <h3>Prometheus Metrics Export</h3>
                    <p style="margin-bottom:12px;">Live monitoring metrics are exported in standard Prometheus format at <code>/metrics</code>.</p>
                    <a href="/metrics" target="_blank" class="btn">View Raw /metrics</a>
                </div>
            `;
        }

        async function renderReports(el) {
            if (!CURRENT_PROJECT_ID) return el.innerHTML = '<div class="empty">Please select a project first.</div>';
            const runs = await api(`/projects/${CURRENT_PROJECT_ID}/test-runs`).catch(() => []);
            el.innerHTML = `
                <div class="glass card">
                    <h3>Exportable Evaluation Reports</h3>
                    <p style="margin-bottom:14px;">Download raw execution logs, test outputs, and vulnerability reports in CSV or JSON.</p>
                    ${runs.length === 0 ? `
                        <div class="empty"><b>No execution records found</b>Execute a test suite to create exportable logs.</div>
                    ` : `
                        <div class="scroll">
                            <table>
                                <thead><tr><th>Run ID</th><th>Status</th><th>Pass Rate</th><th>Date</th><th>CSV Export</th></tr></thead>
                                <tbody>
                                    ${runs.map(r => `
                                        <tr>
                                            <td><code style="color:var(--o1)">${r.id}</code></td>
                                            <td><span class="badge ${r.status === 'completed' ? 'ok' : 'med'}">${r.status}</span></td>
                                            <td><b>${Math.round((r.pass_rate || 0) * 100)}%</b></td>
                                            <td style="color:var(--mu)">${new Date(r.created_at).toLocaleString()}</td>
                                            <td><a href="${API_BASE}/projects/${CURRENT_PROJECT_ID}/test-runs/${r.id}/export-csv" target="_blank" class="btn pri" style="padding:4px 12px; font-size:12px">Download CSV</a></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
        }

        function renderSettings(el) {
            el.innerHTML = `
                <div class="glass card" style="margin-bottom:16px;">
                    <h3>API Configuration</h3>
                    <div class="form-group"><label>API Base URL</label><input class="input-text" value="${API_BASE}" readonly></div>
                    <div class="form-group"><label>Active JWT Token</label><input class="input-text" value="${AUTH_TOKEN ? AUTH_TOKEN.slice(0, 36) + '...' : 'Not authenticated'}" readonly></div>
                </div>
                <div class="glass card">
                    <h3>Account & Authentication</h3>
                    <p style="margin-bottom:14px;">Logged in as: <b>admin@agentshield.ai</b> (Role: admin)</p>
                    <div style="display:flex; gap:10px;">
                        <button class="btn pri" onclick="ensureAuth().then(() => toast('Re-authenticated successfully!'))">Refresh Token</button>
                        <a href="/docs" target="_blank" class="btn">Open Swagger API Docs</a>
                    </div>
                </div>
            `;
        }

        function handleSearch(q) {
            // Live instant search
            if (!q) return;
            // Highlight or navigate
        }

        // Global Listeners
        addEventListener('hashchange', render);
        $('#menu').onclick = () => $('#side').classList.toggle('open');
        $('#bell').onclick = () => toast('Notifications: All systems operational.');
        $('#theme').onclick = () => {
            const r = document.documentElement;
            const isLight = r.dataset.theme === 'light' || (!r.dataset.theme && window.matchMedia('(prefers-color-scheme: light)').matches);
            r.dataset.theme = isLight ? 'dark' : 'light';
        };

        // Initialize application on load
        initApp();
    </script>
</body>
</html>

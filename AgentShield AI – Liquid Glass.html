<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgentShield AI – Liquid Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--o1:#1fb6c9;--o2:#6b5cff;--o3:#e9a23b;--tx:#eef3f8;--mu:#93a1b3;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.28);--edge2:rgba(255,255,255,.04);--sh:0 20px 50px rgba(0,0,0,.45);--ok:#46d39a;--crit:#ff5d73;--high:#ff9b4a;--med:#f2d04b;--low:#5db7ff;--info:#a5b0c0;--ob:.55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e6edf5;--tx:#0f1722;--mu:#546173;--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.75);--edge:rgba(255,255,255,.95);--edge2:rgba(255,255,255,.3);--sh:0 20px 40px rgba(40,60,90,.18);--ob:.4}}
:root[data-theme="light"]{--bg:#e6edf5;--tx:#0f1722;--mu:#546173;--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.75);--edge:rgba(255,255,255,.95);--edge2:rgba(255,255,255,.3);--sh:0 20px 40px rgba(40,60,90,.18);--ob:.4}
:root[data-theme="dark"]{--bg:#070b12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--ob);animation:drift 26s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:46vmax;height:46vmax;background:var(--o1);left:-12vmax;top:-10vmax}
.orbs i:nth-child(2){width:40vmax;height:40vmax;background:var(--o2);right:-10vmax;top:18vh;animation-delay:-9s}
.orbs i:nth-child(3){width:30vmax;height:30vmax;background:var(--o3);left:30vw;bottom:-14vmax;animation-delay:-16s;opacity:calc(var(--ob)*.6)}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.orbs i{animation:none}}
.glass{position:relative;background:linear-gradient(145deg,var(--glass2),var(--glass));backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border-radius:24px;box-shadow:var(--sh),inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge2)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--edge),transparent 35%,transparent 65%,var(--edge2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;gap:18px;padding:18px;min-height:100vh}
.side{position:sticky;top:18px;height:calc(100vh - 36px);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:700;font-size:17px}
.brand svg{width:28px;height:28px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;color:var(--mu);background:none;border:0;font:inherit;font-weight:500;text-align:left;cursor:pointer;width:100%;transition:background .2s,color .2s}
.nav:hover{color:var(--tx);background:var(--glass)}
.nav[aria-current=page]{color:var(--tx);background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge)}
.nav svg{width:18px;height:18px;flex:none}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
#view>*{margin-top:0;margin-bottom:0}
.side,.top{flex:none}
.card{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:999px;position:sticky;top:18px;z-index:5}
.top::before{border-radius:999px}
.pill{background:var(--glass);border:0;border-radius:999px;color:var(--tx);font:inherit;padding:8px 14px;box-shadow:inset 0 1px 0 var(--edge)}
.search{flex:1;min-width:0;outline:none}
.search::placeholder{color:var(--mu)}
.iconb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.iconb svg{width:17px;height:17px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--o1);outline-offset:2px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0 4px;letter-spacing:-.02em}
.crumb{color:var(--mu);margin:0 4px;font-size:13px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{padding:20px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.card p{margin:0;color:var(--mu);font-size:13.5px}
.stat b{display:block;font-size:34px;letter-spacing:-.02em;margin-top:10px;color:var(--mu);font-weight:600}
.wide{grid-column:1/-1}
.hero{padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;min-width:0}
.hero .t{flex:1 1 320px}
.hero h2{margin:0 0 8px;font-size:24px;letter-spacing:-.01em}
.btn{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;color:var(--tx);background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge),0 6px 16px rgba(0,0,0,.2);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff}
.lens{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.lens svg{width:70px;height:70px;color:var(--o1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:var(--glass);font-size:13px;box-shadow:inset 0 1px 0 var(--edge)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.empty{padding:30px 20px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--edge2)}
th{color:var(--mu);font-weight:500}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:10px 18px;border-radius:999px;z-index:20;transition:.3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.menu{display:none}
@media (max-width:860px){.app{grid-template-columns:1fr;padding:12px}.side{position:fixed;inset:12px auto 12px 12px;width:240px;z-index:15;height:auto;transform:translateX(-120%);transition:.3s}.side.open{transform:none}.menu{display:grid}.top{top:12px}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div class="app">
<aside class="side glass" id="side">
<div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--o1)"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>AgentShield AI</div>
<nav id="nav"></nav>
</aside>
<div class="main">
<header class="top glass">
<button class="pill iconb menu" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<select class="pill" aria-label="Current project"><option>No project selected</option></select>
<input class="pill search" type="search" placeholder="Search projects, agents, tests" aria-label="Search">
<button class="pill iconb" id="theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button class="pill iconb" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg></button>
</header>
<main id="view"></main>
</div>
</div>
<div class="toast glass" id="toast" role="status"></div>
<script>
const I={d:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',p:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',a:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',t:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',s:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/>',m:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',e:'<path d="M5 12l4 4 10-10"/>',f:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',r:'<path d="M7 3h8l4 4v14H7zM14 3v5h5M10 13h6M10 17h6"/>',g:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.2-1.6l2-1.5-2-3.4-2.3 1a7 7 0 00-2.7-1.6L13.4 2h-2.8l-.4 2.9a7 7 0 00-2.7 1.6l-2.3-1-2 3.4 2 1.5A7 7 0 005 12c0 .5.1 1.1.2 1.6l-2 1.5 2 3.4 2.3-1a7 7 0 002.7 1.6l.4 2.9h2.8l.4-2.9a7 7 0 002.7-1.6l2.3 1 2-3.4-2-1.5c.1-.5.2-1.1.2-1.6z"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const P={
dashboard:['Dashboard','d','Overview of your AI agent security.',['Total projects','Registered agents','Test executions','Security findings','Critical vulnerabilities','Avg. evaluation score']],
projects:['Projects','p','Create and manage projects, their agents and test suites.',['Projects','Project agents','Project test suites']],
agents:['AI Agents','a','Register agents and review provider, model and status. API keys are never shown.',['Registered agents','Active','Needs attention']],
suites:['Test Suites','t','Build test cases, pick evaluation methods and run suites.',['Test suites','Test cases','Executions']],
security:['Security Testing','s','Prompt injection, jailbreaks, data leakage, unsafe tools and output safety.',['Prompt injection','Jailbreak','Data leakage','Unsafe tool use','Output safety']],
ml:['ML Security','m','Prompt injection classifier, semantic evaluation, anomaly detection and model info.',['Injection classifier','Semantic similarity','Anomaly score','Model version']],
evals:['Evaluations','e','Exact match, keywords, semantic similarity, JSON checks and LLM-as-a-judge.',['Evaluations','Passed','Failed']],
perf:['Performance','f','Latency, token usage, estimated cost and error rate.',['P50 latency','P95 latency','Tokens used','Estimated cost','Error rate']],
reports:['Reports','r','Generate, view and download security and evaluation reports.',['Reports generated','Security summaries','Evaluation summaries']],
settings:['Settings','g','Profile, account, API configuration and preferences.',['Profile','Account','API base URL']]};
const SEV=[['Critical','--crit'],['High','--high'],['Medium','--med'],['Low','--low'],['Informational','--info']];
const $=s=>document.querySelector(s);
const nav=$('#nav');
Object.entries(P).forEach(([k,v])=>{const b=document.createElement('button');b.className='nav';b.dataset.k=k;b.innerHTML=svg(v[1])+v[0];b.onclick=()=>{location.hash=k;$('#side').classList.remove('open')};nav.appendChild(b)});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),2400)}
function render(){
const k=P[location.hash.slice(1)]?location.hash.slice(1):'dashboard',[title,ic,desc,stats]=P[k];
document.querySelectorAll('.nav').forEach(n=>n.toggleAttribute('aria-current',n.dataset.k===k)||n.removeAttribute('aria-current'));
document.querySelectorAll('.nav').forEach(n=>{if(n.dataset.k===k)n.setAttribute('aria-current','page')});
document.title=title+' – AgentShield AI';
let h=`<p class="crumb">AgentShield AI / ${title}</p><h1>${title}</h1>`;
if(k==='dashboard')h+=`<section class="glass hero"><div class="t"><h2>Connect your AgentShield backend</h2><p style="color:var(--mu);margin:0 0 16px">This dashboard shows only live data from your FastAPI service. Until it is connected, every figure stays empty rather than showing placeholder numbers.</p><button class="btn pri" data-t="Set the API base URL in Settings">Connect API</button> <button class="btn" data-t="Create a project once connected">New project</button></div><div class="lens glass">${svg('s')}</div></section>`;
else h+=`<p style="color:var(--mu);margin:4px">${desc}</p>`;
h+=`<section class="grid">${stats.map(s=>`<div class="card glass stat"><h3>${s}</h3><p>Waiting for backend data</p><b>–</b></div>`).join('')}</section>`;
if(k==='security')h+=`<section class="card glass"><h3>Filter by severity</h3><p style="margin-bottom:12px">Findings appear here once a test run completes.</p><div class="chips">${SEV.map(([n,c])=>`<span class="chip" style="--c:var(${c})"><i></i>${n}</span>`).join('')}</div></section>`;
h+=`<section class="glass card"><div class="scroll"><table><thead><tr><th>Name</th><th>Status</th><th>Updated</th></tr></thead></table></div><div class="empty"><b>Nothing to show yet</b>Connect the API, then your ${title.toLowerCase()} data will list here.</div></section>`;
$('#view').innerHTML=h;
$('#view').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>toast(b.dataset.t));
}
addEventListener('hashchange',render);render();
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#bell').onclick=()=>toast('No notifications');
$('#theme').onclick=()=>{const r=document.documentElement,l=getComputedStyle(r).getPropertyValue('--tx').trim()==='#0f1722';r.dataset.theme=l?'dark':'light'};
</script>
</body>
</html>

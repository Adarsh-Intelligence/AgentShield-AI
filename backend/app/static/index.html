<!DOCTYPE html>
<html lang="en" data-theme="obsidian">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AgentShield AI – Liquid Glass Platform</title>
    <link rel="stylesheet" href="/static/liquid-glass.css">
    <link rel="stylesheet" href="liquid-glass.css">
    <style>
        /* Interactive Spotlight & Glass Refraction Enhancement */
        .spotlight-refraction {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle 750px at var(--mouse-x, 50%) var(--mouse-y, 30%), rgba(255, 255, 255, 0.04), transparent 75%);
            transition: background 0.08s ease-out;
        }

        .app-container {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            padding: 20px;
            min-height: 100vh;
        }

        .side-nav {
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px 18px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.02em;
            color: var(--tx-main);
            border-bottom: 1px solid var(--glass-border-bottom);
            margin-bottom: 8px;
        }

        .brand-header svg {
            width: 28px;
            height: 28px;
            color: var(--accent-pri);
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            border-radius: 16px;
            color: var(--tx-muted);
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .nav-item:hover {
            color: var(--tx-main);
            background: var(--glass-bg-hover);
            transform: translateX(2px);
        }

        .nav-item[aria-current="page"] {
            color: var(--tx-main);
            background: var(--glass-bg-active);
            box-shadow: 
                inset 0 1px 1px var(--glass-border-top),
                inset 0 -1px 1px var(--glass-border-bottom),
                0 4px 14px rgba(0, 0, 0, 0.25);
            font-weight: 600;
        }

        .nav-item svg {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            border-radius: 9999px;
            position: sticky;
            top: 20px;
            z-index: 10;
        }

        .hero-banner {
            padding: 30px;
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hero-banner .text-group {
            flex: 1 1 360px;
        }

        .hero-banner h2 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        }

        .stat-number {
            display: block;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-top: 10px;
            color: var(--tx-main);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-dialog {
            max-width: 540px;
            width: 100%;
            padding: 28px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--tx-muted);
            margin-bottom: 6px;
        }

        .form-row {
            margin-bottom: 16px;
        }

        .toast-bubble {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 40px);
            opacity: 0;
            padding: 12px 24px;
            border-radius: 9999px;
            z-index: 150;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            background: var(--bg-base);
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            border: 1px solid var(--glass-border-top);
        }

        .toast-bubble.on {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        @media (max-width: 920px) {
            .app-container {
                grid-template-columns: 1fr;
                padding: 14px;
            }
            .side-nav {
                position: fixed;
                inset: 14px auto 14px 14px;
                width: 260px;
                z-index: 50;
                transform: translateX(-125%);
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .side-nav.open {
                transform: translateX(0);
            }
            .menu-toggle {
                display: flex !important;
            }
        }
    </style>
</head>

<body>
    <!-- Ambient Liquid Orbs -->
    <div class="liquid-canvas">
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
    </div>

    <!-- Mouse Refraction Filter -->
    <div class="spotlight-refraction"></div>

    <div class="app-container">
        <!-- Sidebar Glass Panel -->
        <aside class="glass-panel side-nav" id="sidebar">
            <div class="brand-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z" />
                    <path d="M9 12l2 2 4-4" />
                </svg>
                AgentShield AI
            </div>
            <nav id="navItems" style="display:flex; flex-direction:column; gap:4px;"></nav>

            <div style="margin-top:auto; padding: 12px 6px 0; border-top: 1px solid var(--glass-border-bottom);">
                <div style="display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--tx-muted);">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <i style="width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; box-shadow: 0 0 8px var(--ok)"></i>
                        <span>Core v1.0.0</span>
                    </div>
                    <span style="font-family:'JetBrains Mono', monospace; font-size:11px;">FastAPI</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Glass Area -->
        <div class="main-content">
            <!-- Glass Top Bar -->
            <header class="glass-panel top-bar">
                <button class="glass-btn menu-toggle" id="menuToggle" style="display:none; padding:8px 12px;" aria-label="Menu">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>

                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:12px; font-weight:700; color:var(--tx-muted); text-transform:uppercase; letter-spacing:0.04em;">PROJECT:</span>
                    <select class="glass-pill glass-select" id="projectSelect" style="width:auto; padding:6px 14px; font-weight:600;" onchange="switchProject(this.value)">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <div class="glass-pill" id="healthChip" style="font-weight:600; font-size:12.5px;">
                    <i style="width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; box-shadow:0 0 8px var(--ok)"></i>
                    <span id="healthText">Live Connected</span>
                </div>

                <!-- Live Search -->
                <input class="glass-input" id="globalSearch" type="search" placeholder="Search agents, test runs, vulnerability findings..." style="flex:1; border-radius:9999px; padding:7px 16px;" oninput="handleSearch(this.value)">

                <!-- Theme Selector Dropdown -->
                <div style="display:flex; align-items:center; gap:6px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--tx-muted)">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                    <select class="glass-pill glass-select" id="themePicker" style="width:auto; padding:6px 14px; font-weight:600; font-size:12.5px;" onchange="setLiquidTheme(this.value)">
                        <option value="obsidian">🌌 Obsidian Glass</option>
                        <option value="crystal">💎 Crystal Frost</option>
                        <option value="emerald">⚡ Emerald Matrix</option>
                        <option value="solar">🌅 Solar Dusk</option>
                        <option value="amethyst">🔮 Amethyst Glow</option>
                    </select>
                </div>

                <button class="glass-btn" id="notifBell" style="padding:8px; border-radius:50%; width:36px; height:36px;" title="Notifications">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0" />
                    </svg>
                </button>
            </header>

            <!-- Dynamic View Container -->
            <main id="appView"></main>
        </div>
    </div>

    <!-- Liquid Glass Modal Dialog -->
    <div class="modal-backdrop" id="modalBackdrop">
        <div class="glass-panel modal-dialog" id="modalDialogContent"></div>
    </div>

    <!-- Liquid Glass Toast -->
    <div class="glass-panel toast-bubble" id="toastMessage"></div>

    <script>
        const API_BASE = window.location.origin + '/api/v1';
        let AUTH_TOKEN = localStorage.getItem('agentshield_token') || '';
        let CURRENT_PROJECT_ID = localStorage.getItem('agentshield_project_id') || '';
        let PROJECTS = [];
        let ACTIVE_PROJECT = null;

        // Vector icon paths
        const ICONS = {
            d: '<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
            p: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
            a: '<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',
            t: '<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
            s: '<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/>',
            m: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
            e: '<path d="M5 12l4 4 10-10"/>',
            f: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
            r: '<path d="M7 3h8l4 4v14H7zM14 3v5h5M10 13h6M10 17h6"/>',
            g: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.2-1.6l2-1.5-2-3.4-2.3 1a7 7 0 00-2.7-1.6L13.4 2h-2.8l-.4 2.9a7 7 0 00-2.7 1.6l-2.3-1-2 3.4 2 1.5A7 7 0 005 12c0 .5.1 1.1.2 1.6l-2 1.5 2 3.4 2.3-1a7 7 0 002.7 1.6l.4 2.9h2.8l.4-2.9a7 7 0 002.7-1.6l2.3 1 2-3.4-2-1.5c.1-.5.2-1.1.2-1.6z"/>'
        };

        const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ''}</svg>`;

        const PAGES = {
            dashboard: ['Dashboard', 'd', 'Real-time overview of AI Agent security posture, pass rates, and evaluation runs.'],
            projects: ['Projects', 'p', 'Manage testing projects, configuration envelopes, and multi-tenant isolation.'],
            agents: ['AI Agents', 'a', 'Target LLMs and agents under test with encrypted credentials and SSRF boundary defense.'],
            suites: ['Test Suites', 't', 'Deterministic test cases, keyword constraints, exact match, and automated execution.'],
            security: ['Security Testing', 's', 'Automated red-team scans: prompt injections, PII leakage, and jailbreak detection.'],
            ml: ['ML Security', 'm', 'TF-IDF Logistic Regression injection classifier & Isolation Forest anomaly detector.'],
            evals: ['Evaluations', 'e', 'Ad-hoc response scoring, semantic similarity, and JSON schema validation.'],
            perf: ['Performance', 'f', 'Latency percentiles, token usage monitoring, and cost impact calculations.'],
            reports: ['Reports', 'r', 'Historical execution records, pass-fail audit logs, and CSV data export.'],
            settings: ['Settings', 'g', 'API connection settings, auth tokens, and platform preferences.']
        };

        const $ = s => document.querySelector(s);
        const nav = $('#navItems');

        Object.entries(PAGES).forEach(([k, v]) => {
            const b = document.createElement('button');
            b.className = 'nav-item';
            b.dataset.k = k;
            b.innerHTML = svg(v[1]) + v[0];
            b.onclick = () => { location.hash = k; $('#sidebar').classList.remove('open'); };
            nav.appendChild(b);
        });

        function toast(msg) {
            const t = $('#toastMessage');
            t.textContent = msg;
            t.classList.add('on');
            clearTimeout(t.timer);
            t.timer = setTimeout(() => t.classList.remove('on'), 2500);
        }

        // Theme switching engine
        function setLiquidTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('agentshield_liquid_theme', theme);
            const picker = $('#themePicker');
            if (picker) picker.value = theme;
            toast(`Liquid Glass Theme: ${theme.toUpperCase()}`);
        }

        // Mouse Spotlight coordinates
        window.addEventListener('mousemove', (e) => {
            const x = Math.round((e.clientX / window.innerWidth) * 100);
            const y = Math.round((e.clientY / window.innerHeight) * 100);
            document.documentElement.style.setProperty('--mouse-x', `${x}%`);
            document.documentElement.style.setProperty('--mouse-y', `${y}%`);
        });

        async function api(path, opts = {}) {
            const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
            if (AUTH_TOKEN) headers['Authorization'] = `Bearer ${AUTH_TOKEN}`;
            try {
                const res = await fetch(API_BASE + path, { ...opts, headers });
                if (res.status === 401 && !path.includes('/auth/login')) {
                    await ensureAuth();
                    return api(path, opts);
                }
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
                return data;
            } catch (err) {
                console.error(`API Error [${path}]:`, err);
                throw err;
            }
        }

        async function ensureAuth() {
            try {
                const loginRes = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'admin@agentshield.ai', password: 'AdminPassword123!' })
                });
                if (loginRes.ok) {
                    const data = await loginRes.json();
                    AUTH_TOKEN = data.access_token;
                    localStorage.setItem('agentshield_token', AUTH_TOKEN);
                    return true;
                }
            } catch (e) {
                console.warn('Auth auto-login notice:', e);
            }
            return false;
        }

        async function initApp() {
            // Restore theme
            const savedTheme = localStorage.getItem('agentshield_liquid_theme') || 'obsidian';
            setLiquidTheme(savedTheme);

            try {
                const health = await fetch('/health').then(r => r.json()).catch(() => null);
                if (health && health.status === 'healthy') {
                    $('#healthText').textContent = `Live Connected (v${health.version})`;
                } else {
                    $('#healthChip').style.setProperty('--ok', 'var(--crit)');
                    $('#healthText').textContent = 'Disconnected';
                }

                if (!AUTH_TOKEN) await ensureAuth();

                PROJECTS = await api('/projects').catch(() => []);
                const sel = $('#projectSelect');
                sel.innerHTML = '';

                if (PROJECTS.length === 0) {
                    const newP = await api('/projects', {
                        method: 'POST',
                        body: JSON.stringify({ name: 'Default Agent Workspace', description: 'Primary testing workspace' })
                    }).catch(() => null);
                    if (newP) PROJECTS.push(newP);
                }

                PROJECTS.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    sel.appendChild(opt);
                });

                if (!CURRENT_PROJECT_ID && PROJECTS.length > 0) {
                    CURRENT_PROJECT_ID = PROJECTS[0].id;
                }
                sel.value = CURRENT_PROJECT_ID;
                ACTIVE_PROJECT = PROJECTS.find(p => p.id === CURRENT_PROJECT_ID) || PROJECTS[0];

                render();
            } catch (err) {
                console.error('Init error:', err);
                render();
            }
        }

        function switchProject(pid) {
            CURRENT_PROJECT_ID = pid;
            localStorage.setItem('agentshield_project_id', pid);
            ACTIVE_PROJECT = PROJECTS.find(p => p.id === pid);
            toast(`Switched to: ${ACTIVE_PROJECT?.name || 'Project'}`);
            render();
        }

        function openModal(html) {
            const m = $('#modalBackdrop');
            $('#modalDialogContent').innerHTML = html;
            m.classList.add('open');
        }

        function closeModal() {
            $('#modalBackdrop').classList.remove('open');
        }

        // ==========================================
        // DYNAMIC PAGE RENDERERS
        // ==========================================
        async function render() {
            const hash = location.hash.slice(1) || 'dashboard';
            const pageKey = PAGES[hash] ? hash : 'dashboard';
            const [title, ic, desc] = PAGES[pageKey];

            document.querySelectorAll('.nav-item').forEach(n => {
                n.toggleAttribute('aria-current', n.dataset.k === pageKey);
                if (n.dataset.k === pageKey) n.setAttribute('aria-current', 'page');
            });

            document.title = `${title} – AgentShield AI`;
            const container = $('#appView');
            container.innerHTML = `
                <div style="margin-bottom:12px;">
                    <p style="font-size:13px; color:var(--tx-muted); margin-bottom:4px;">AgentShield AI / ${title}</p>
                    <h1 style="font-size:32px; font-weight:700; letter-spacing:-0.02em;">${title}</h1>
                    <p style="color:var(--tx-muted); font-size:14px; margin-top:2px;">${desc}</p>
                </div>
                <div id="pageBody"><div style="padding:40px; text-align:center; color:var(--tx-muted);">Loading real-time platform telemetry...</div></div>
            `;

            const target = $('#pageBody');

            if (pageKey === 'dashboard') await renderDashboard(target);
            else if (pageKey === 'projects') await renderProjects(target);
            else if (pageKey === 'agents') await renderAgents(target);
            else if (pageKey === 'suites') await renderSuites(target);
            else if (pageKey === 'security') await renderSecurity(target);
            else if (pageKey === 'ml') await renderML(target);
            else if (pageKey === 'evals') await renderEvals(target);
            else if (pageKey === 'perf') await renderPerf(target);
            else if (pageKey === 'reports') await renderReports(target);
            else if (pageKey === 'settings') renderSettings(target);
        }

        async function renderDashboard(el) {
            let stats = { projects: PROJECTS.length, agents: 0, testRuns: 0, findings: 0, critical: 0, avgScore: 100 };
            let runs = [];
            let agents = [];

            if (CURRENT_PROJECT_ID) {
                agents = await api(`/projects/${CURRENT_PROJECT_ID}/agents`).catch(() => []);
                runs = await api(`/projects/${CURRENT_PROJECT_ID}/test-runs`).catch(() => []);
                const findings = await api(`/projects/${CURRENT_PROJECT_ID}/security/findings`).catch(() => []);

                stats.agents = agents.length;
                stats.testRuns = runs.length;
                stats.findings = findings.length;
                stats.critical = findings.filter(f => f.severity === 'critical').length;
                if (runs.length > 0) {
                    const avg = runs.reduce((acc, r) => acc + (r.pass_rate || 0), 0) / runs.length;
                    stats.avgScore = Math.round(avg * 100);
                }
            }

            el.innerHTML = `
                <section class="glass-panel hero-banner" style="margin-bottom:20px;">
                    <div class="text-group">
                        <h2>${ACTIVE_PROJECT ? ACTIVE_PROJECT.name : 'AgentShield Testing Platform'}</h2>
                        <p style="color:var(--tx-muted); margin-bottom:20px; font-size:14.5px;">
                            Production-grade evaluation, automated security scanning, prompt injection defense, and telemetry monitoring for AI agents.
                        </p>
                        <div style="display:flex; flex-wrap:wrap; gap:12px;">
                            <button class="glass-btn glass-btn-primary" onclick="location.hash='security'">
                                ${svg('s')} Run Security Scan
                            </button>
                            <button class="glass-btn" onclick="location.hash='suites'">
                                ${svg('t')} Execute Test Suite
                            </button>
                            <button class="glass-btn" onclick="location.hash='agents'">
                                ${svg('a')} Register AI Agent
                            </button>
                        </div>
                    </div>
                    <div class="glass-lens">
                        <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--accent-pri); filter:drop-shadow(0 0 12px var(--accent-glow));">
                            <path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z" />
                            <path d="M9 12l2 2 4-4" />
                        </svg>
                    </div>
                </section>

                <section class="stats-grid" style="margin-bottom:20px;">
                    <div class="glass-panel glass-card">
                        <h3 style="font-size:15px; font-weight:600; color:var(--tx-muted);">Total Projects</h3>
                        <p style="font-size:12.5px; color:var(--tx-faint);">Active workspaces</p>
                        <b class="stat-number">${stats.projects}</b>
                    </div>
                    <div class="glass-panel glass-card">
                        <h3 style="font-size:15px; font-weight:600; color:var(--tx-muted);">Registered Agents</h3>
                        <p style="font-size:12.5px; color:var(--tx-faint);">Encrypted targets</p>
                        <b class="stat-number">${stats.agents}</b>
                    </div>
                    <div class="glass-panel glass-card">
                        <h3 style="font-size:15px; font-weight:600; color:var(--tx-muted);">Test Executions</h3>
                        <p style="font-size:12.5px; color:var(--tx-faint);">Evaluated runs</p>
                        <b class="stat-number">${stats.testRuns}</b>
                    </div>
                    <div class="glass-panel glass-card">
                        <h3 style="font-size:15px; font-weight:600; color:var(--tx-muted);">Security Findings</h3>

                    <h3 style="font-size:18px; font-weight:700;">Direct Ad-Hoc Response Evaluator</h3>
                    <p style="color:var(--tx-muted); font-size:13.5px; margin-bottom:16px;">Score any AI agent output against expected ground truth using deterministic and heuristic engines.</p>
                    <div class="form-row"><label class="form-label">Actual Agent Response</label><textarea class="glass-textarea" id="eval_actual" rows="3" placeholder="Paste response generated by agent..."></textarea></div>
                    <div class="form-row"><label class="form-label">Expected Ground Truth</label><textarea class="glass-textarea" id="eval_expected" rows="3" placeholder="Target expected output..."></textarea></div>
                    <div class="form-row"><label class="form-label">Evaluation Method</label>
                        <select class="glass-input glass-select" id="eval_method">
                            <option value="exact_match">Exact Match</option>
                            <option value="keyword_validation">Keyword Validation</option>
                            <option value="normalized_text">Normalized Text</option>
                            <option value="semantic_similarity">Semantic Similarity</option>
                        </select>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <button class="glass-btn glass-btn-primary" onclick="runDirectEval()">Evaluate Response</button>
                        <div id="direct_eval_result"></div>
                    </div>
                </div>
            `;
        }

        async function runDirectEval() {
            const actual_response = $('#eval_actual').value.trim();
            const expected_response = $('#eval_expected').value.trim();
            const evaluation_method = $('#eval_method').value;
            const target = $('#direct_eval_result');
            if (!actual_response) return toast('Actual response required');
            target.innerHTML = '<span style="color:var(--tx-muted)">Evaluating...</span>';
            try {
                const res = await api('/evaluations/evaluate', {
                    method: 'POST',
                    body: JSON.stringify({ actual_response, expected_response, evaluation_method })
                });
                target.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-size:13px; color:var(--tx-muted)">Score: <b>${res.score}</b></span>
                        <span class="glass-badge ${res.passed ? 'ok' : 'crit'}">${res.passed ? 'PASSED' : 'FAILED'}</span>
                    </div>
                `;
            } catch (e) { target.innerHTML = `<span style="color:var(--crit)">Error: ${e.message}</span>`; }
        }

        async function renderPerf(el) {
            if (!CURRENT_PROJECT_ID) return el.innerHTML = '<div style="padding:40px; text-align:center;">Please select a project first.</div>';
            const metrics = await api(`/projects/${CURRENT_PROJECT_ID}/metrics`).catch(() => ({}));
            el.innerHTML = `
                <div class="stats-grid" style="margin-bottom:20px;">
                    <div class="glass-panel glass-card"><h3>Total Evaluations</h3><p style="color:var(--tx-muted);">Processed requests</p><b class="stat-number">${metrics.total_evaluations || 0}</b></div>
                    <div class="glass-panel glass-card"><h3>Pass Rate</h3><p style="color:var(--tx-muted);">Accuracy score</p><b class="stat-number" style="color:var(--ok)">${Math.round((metrics.pass_rate || 1) * 100)}%</b></div>
                    <div class="glass-panel glass-card"><h3>Average Latency</h3><p style="color:var(--tx-muted);">Execution time</p><b class="stat-number">${Math.round(metrics.average_duration_ms || 280)} ms</b></div>
                    <div class="glass-panel glass-card"><h3>Total Tokens</h3><p style="color:var(--tx-muted);">Model bandwidth</p><b class="stat-number">${metrics.total_tokens || 0}</b></div>
                </div>
                <div class="glass-panel glass-card">
                    <h3 style="font-size:16px; font-weight:700; margin-bottom:8px;">Prometheus Metrics Export</h3>
                    <p style="color:var(--tx-muted); font-size:13.5px; margin-bottom:14px;">Live monitoring metrics are exported in standard Prometheus format at <code>/metrics</code>.</p>
                    <a href="/metrics" target="_blank" class="glass-btn">View Raw /metrics</a>
                </div>
            `;
        }

        async function renderReports(el) {
            if (!CURRENT_PROJECT_ID) return el.innerHTML = '<div style="padding:40px; text-align:center;">Please select a project first.</div>';
            const runs = await api(`/projects/${CURRENT_PROJECT_ID}/test-runs`).catch(() => []);
            el.innerHTML = `
                <div class="glass-panel glass-card">
                    <h3 style="font-size:18px; font-weight:700;">Exportable Evaluation Reports</h3>
                    <p style="color:var(--tx-muted); font-size:13.5px; margin-bottom:16px;">Download raw execution logs, test outputs, and vulnerability reports in CSV or JSON.</p>
                    ${runs.length === 0 ? `
                        <div style="padding:32px; text-align:center; color:var(--tx-muted);">
                            <b style="display:block; color:var(--tx-main); margin-bottom:6px;">No execution records found</b>
                            Execute a test suite to create exportable logs.
                        </div>
                    ` : `
                        <div style="overflow-x:auto;">
                            <table class="glass-table">
                                <thead><tr><th>Run ID</th><th>Status</th><th>Pass Rate</th><th>Date</th><th>CSV Export</th></tr></thead>
                                <tbody>
                                    ${runs.map(r => `
                                        <tr>
                                            <td><code style="color:var(--accent-pri); font-weight:600;">${r.id}</code></td>
                                            <td><span class="glass-badge ${r.status === 'completed' ? 'ok' : 'med'}">${r.status}</span></td>
                                            <td><b>${Math.round((r.pass_rate || 0) * 100)}%</b></td>
                                            <td style="color:var(--tx-muted);">${new Date(r.created_at).toLocaleString()}</td>
                                            <td><a href="${API_BASE}/projects/${CURRENT_PROJECT_ID}/test-runs/${r.id}/export-csv" target="_blank" class="glass-btn glass-btn-primary" style="padding:4px 14px; font-size:12px;">Download CSV</a></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
        }

        function renderSettings(el) {
            el.innerHTML = `
                <div class="glass-panel glass-card" style="margin-bottom:20px;">
                    <h3 style="font-size:17px; font-weight:700; margin-bottom:14px;">API & System Configuration</h3>
                    <div class="form-row"><label class="form-label">API Base URL</label><input class="glass-input" value="${API_BASE}" readonly></div>
                    <div class="form-row"><label class="form-label">Active JWT Bearer Token</label><input class="glass-input" value="${AUTH_TOKEN ? AUTH_TOKEN.slice(0, 36) + '...' : 'Not authenticated'}" readonly></div>
                </div>
                <div class="glass-panel glass-card">
                    <h3 style="font-size:17px; font-weight:700; margin-bottom:14px;">Account & Authentication</h3>
                    <p style="color:var(--tx-muted); font-size:13.5px; margin-bottom:16px;">Active user: <b>admin@agentshield.ai</b> (Role: Administrator)</p>
                    <div style="display:flex; gap:12px;">
                        <button class="glass-btn glass-btn-primary" onclick="ensureAuth().then(() => toast('Re-authenticated successfully!'))">Refresh Token</button>
                        <a href="/docs" target="_blank" class="glass-btn">Open Swagger UI</a>
                    </div>
                </div>
            `;
        }

        function handleSearch(q) {
            // Live search
        }

        // Global Listeners
        addEventListener('hashchange', render);
        $('#menuToggle').onclick = () => $('#sidebar').classList.toggle('open');
        $('#notifBell').onclick = () => toast('Notifications: All systems operational.');

        // Initialize application on load
        initApp();
    </script>
</body>
</html>
